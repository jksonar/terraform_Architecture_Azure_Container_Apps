{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Login — TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title mb-4 text-center">Log in</h2>
        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
        </form>
        <hr>
        <p class="text-center mb-0">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
