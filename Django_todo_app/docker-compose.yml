services:
  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/local.txt
    image: django-taskmanager:local
    env_file:
      - .env.local
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Bind-mount source so --reload picks up code changes instantly
      - .:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             uvicorn taskmanager.asgi:application
               --host 0.0.0.0 --port 8000 --reload"
