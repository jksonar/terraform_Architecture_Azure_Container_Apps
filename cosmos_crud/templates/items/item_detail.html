{% extends 'base.html' %}
{% block title %}{{ item.name }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ item.name }}</h1>
<dl class="row">
  <dt class="col-sm-3">Status</dt>
  <dd class="col-sm-9"><span class="badge text-bg-secondary">{{ item.status }}</span></dd>

  <dt class="col-sm-3">Description</dt>
  <dd class="col-sm-9">{{ item.description|default:'—' }}</dd>

  <dt class="col-sm-3">Created</dt>
  <dd class="col-sm-9">{{ item.created_at }}</dd>
</dl>

<a href="{% url 'items:update' item.id %}" class="btn btn-outline-secondary"><i class="bi bi-pencil me-1"></i>Edit</a>
<a href="{% url 'items:delete' item.id %}" class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i>Delete</a>
<a href="{% url 'items:list' %}" class="btn btn-link">Back to list</a>
{% endblock %}
